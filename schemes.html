        :root {
            --primary: #D62828;
            --primary-dark: #b81f1f;
            --accent: #F4C430;
            --text-dark: #1E1E1E;
            --text-light: #555555;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 40px rgba(214, 40, 40, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Noto Sans Tamil', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #f4f7f6;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
            position: relative;
        }

        /* Abstract Background Elements */
        .bg-shape { position: absolute; filter: blur(90px); border-radius: 50%; z-index: -1; opacity: 0.4; }
        .bg-shape-1 { top: 0; left: -10%; width: 50vw; height: 50vw; background-color: var(--primary); animation: float 12s ease-in-out infinite alternate; }
        .bg-shape-2 { top: 40%; right: -20%; width: 40vw; height: 40vw; background-color: var(--accent); animation: float 15s ease-in-out infinite alternate-reverse; }

        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(40px) scale(1.1); } }

        /* Glassmorphism Utilities */
        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow-soft); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Navbar */
        .navbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { color: var(--text-dark); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--primary); transform: translateX(-3px); }
        .logo { width: 35px; height: auto; }
        .nav-title { font-size: 18px; font-weight: 700; color: var(--primary); }

        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-icon { font-size: 20px; color: var(--text-dark); cursor: pointer; position: relative; }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: var(--text-dark); font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 50%; }

        /* Language Toggle */
        .lang-toggle {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            padding: 3px;
            cursor: pointer;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            user-select: none;
        }
        .lang-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            border-radius: 18px;
            transition: 0.3s;
            z-index: 1;
            text-align: center;
            width: 45px;
        }
        .lang-btn.active { color: white; }
        .lang-slider {
            position: absolute;
            top: 3px;
            left: 3px;
            height: calc(100% - 6px);
            width: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 18px;
            transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 2px 10px rgba(214, 40, 40, 0.3);
        }
        .lang-toggle[data-current="ta"] .lang-slider { transform: translateX(45px); }

        /* Page Transition Fade */
        .fade-content { transition: opacity 0.3s ease; }
        .fade-out { opacity: 0; }
        .fade-in { opacity: 1; }

        /* Hero Section */
        .hero-section { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); padding: 35px 25px; border-radius: 24px; margin-bottom: 25px; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(214, 40, 40, 0.25); text-align: center; }
        .hero-section::after { content: ''; position: absolute; right: -20px; top: -20px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; filter: blur(15px); }
        .hero-title { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .hero-subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 25px; font-style: italic; }

        /* Search Bar */
        .search-container { display: flex; align-items: center; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 5px 20px; max-width: 600px; margin: 0 auto; color: white; transition: 0.3s; }
        .search-container:focus-within { background: rgba(255, 255, 255, 0.3); border-color: white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .search-container input { flex: 1; border: none; padding: 12px 10px; font-size: 15px; outline: none; background: transparent; color: white; }
        .search-container input::placeholder { color: rgba(255,255,255,0.7); }
        .search-container i { color: white; font-size: 18px; }

        /* Categories */
        .categories-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; margin-bottom: 25px; }
        .categories-scroll::-webkit-scrollbar { height: 4px; }
        .categories-scroll::-webkit-scrollbar-thumb { background: rgba(214, 40, 40, 0.3); border-radius: 10px; }
        .category-chip { padding: 10px 20px; background: white; border: 1px solid rgba(0,0,0,0.05); border-radius: 20px; font-size: 14px; font-weight: 500; color: var(--text-light); white-space: nowrap; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .category-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .category-chip.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 6px 15px rgba(214, 40, 40, 0.2); }

        /* Scheme Cards Grid */
        .schemes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; min-height: 300px; }
        .scheme-card { padding: 25px; display: flex; flex-direction: column; gap: 15px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .scheme-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); border-color: rgba(214, 40, 40, 0.2); }
        .card-header { display: flex; align-items: flex-start; gap: 15px; }
        .icon-box { width: 55px; height: 55px; border-radius: 16px; background: linear-gradient(135deg, rgba(214, 40, 40, 0.1), rgba(244, 196, 48, 0.15)); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .scheme-category { font-size: 11px; font-weight: 700; color: #b58d10; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .scheme-title { font-size: 16px; font-weight: 600; color: var(--text-dark); line-height: 1.3; }
        .scheme-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; flex-grow: 1; }
        .eligibility { background: rgba(0,0,0,0.03); padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--text-dark); border-left: 3px solid var(--accent); }
        .btn-apply { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; display: inline-block; }
        .btn-apply:hover { box-shadow: 0 8px 20px rgba(214, 40, 40, 0.3); transform: translateY(-2px); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 10px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.05); z-index: 1000; border-radius: 25px 25px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-light); font-size: 12px; gap: 5px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item.active i { transform: translateY(-3px); }
        .nav-item i { font-size: 20px; transition: 0.3s; }
        .nav-item:hover { color: var(--primary); }

        /* No Results State */
        .no-results { text-align: center; padding: 40px; grid-column: 1 / -1; color: var(--text-light); }
        .no-results i { font-size: 40px; margin-bottom: 15px; color: #ddd; }

        /* Responsive */
        @media(max-width: 768px) { .schemes-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); } .hero-title { font-size: 22px; } }
    </style>

                desc_en: "Free training programs to enhance the employability of unemployed youth.",
                desc_ta: "வேலையற்ற இளைஞர்களின் வேலைவாய்ப்பை மேம்படுத்த இலவச பயிற்சித் திட்டங்கள்.",
                eligibility_en: "Unemployed youth in Tamil Nadu.",
                eligibility_ta: "தமிழகத்தில் உள்ள வேலையற்ற இளைஞர்கள்.",
                link: "https://www.tnskill.tn.gov.in/",
                icon: "fa-tools"
            },
            {
                filterCat: "Housing",
                category_en: "Housing",
                category_ta: "வீட்டுவசதி",
                title_en: "PMAY Housing Scheme",
                title_ta: "PMAY வீட்டுவசதித் திட்டம்",
                desc_en: "Affordable housing for all by providing financial assistance to build pucca houses.",
                desc_ta: "கான்கிரீட் வீடுகள் கட்ட நிதியுதவி வழங்கும் குறைந்த விலை வீட்டுவசதி திட்டம்.",
                eligibility_en: "EWS, LIG, and MIG income groups.",
                eligibility_ta: "EWS, LIG மற்றும் MIG வருமானப் பிரிவினர்.",
                link: "https://pmaymis.gov.in/",
                icon: "fa-house-chimney"
            }
        ];

        // Language toggle variables
        const langToggle = document.getElementById('lang-toggle');
        const langEnBtn = document.getElementById('lang-en');
        const langTaBtn = document.getElementById('lang-ta');
        const mainContent = document.getElementById('main-content');
        
        let currentLang = localStorage.getItem('app_lang') || 'en';

        // Filters variables
        const schemesGrid = document.getElementById('schemesGrid');
        const searchInput = document.getElementById('searchInput');
        const filterChips = document.querySelectorAll('.category-chip');
        let activeFilter = 'All';
        let searchQuery = '';

        function renderSchemes() {
            schemesGrid.innerHTML = '';

            const filteredSchemes = schemesData.filter(scheme => {
                const matchesCategory = activeFilter === 'All' || scheme.filterCat === activeFilter;
                
                // search matching across EN and TA
                const stTitle = scheme[`title_${currentLang}`].toLowerCase();
                const stDesc = scheme[`desc_${currentLang}`].toLowerCase();
                const stCat = scheme[`category_${currentLang}`].toLowerCase();

                const matchesSearch = stTitle.includes(searchQuery) || stDesc.includes(searchQuery) || stCat.includes(searchQuery);

                return matchesCategory && matchesSearch;
            });

            if (filteredSchemes.length === 0) {
                schemesGrid.innerHTML = `
                    <div class="no-results">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3>${translations[currentLang].no_schemes}</h3>
                        <p>${translations[currentLang].no_schemes_sub}</p>
                    </div>
                `;
                return;
            }

            filteredSchemes.forEach(scheme => {
                const card = document.createElement('div');
                card.className = 'scheme-card glass';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="icon-box"><i class="fa-solid ${scheme.icon}"></i></div>
                        <div>
                            <div class="scheme-category">${scheme[`category_${currentLang}`]}</div>
                            <div class="scheme-title">${scheme[`title_${currentLang}`]}</div>
                        </div>
                    </div>
                    <div class="scheme-desc">${scheme[`desc_${currentLang}`]}</div>
                    <div class="eligibility">
                        <i class="fa-solid fa-circle-check" style="color:var(--primary); margin-right:5px;"></i> 
                        ${scheme[`eligibility_${currentLang}`]}
                    </div>
                    <a href="${scheme.link}" target="_blank" rel="noopener noreferrer" class="btn-apply">
                        ${translations[currentLang].apply_now} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; margin-left: 5px;"></i>
                    </a>
                `;
                schemesGrid.appendChild(card);
            });
        }

        function updateLanguage(lang) {
            langToggle.setAttribute('data-current', lang);
            if(lang === 'ta') {
                langTaBtn.classList.add('active');
                langEnBtn.classList.remove('active');
            } else {
                langEnBtn.classList.add('active');
                langTaBtn.classList.remove('active');
            }

            mainContent.classList.add('fade-out');

            setTimeout(() => {
                const elements = document.querySelectorAll('[data-translate]');
                elements.forEach(el => {
                    const key = el.getAttribute('data-translate');
                    if(translations[lang] && translations[lang][key]) {
                        el.innerText = translations[lang][key];
                    }
                });

                const placeholders = document.querySelectorAll('[data-translate-placeholder]');
                placeholders.forEach(el => {
                    const key = el.getAttribute('data-translate-placeholder');
                    if(translations[lang] && translations[lang][key]) {
                        el.setAttribute('placeholder', translations[lang][key]);
                    }
                });

                // re-render scheme cards for new language
                renderSchemes();

                mainContent.classList.remove('fade-out');
            }, 300);

            localStorage.setItem('app_lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup Listeners
            langToggle.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ta' : 'en';
                updateLanguage(currentLang);
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderSchemes();
            });

            filterChips.forEach(chip => {
                chip.addEventListener('click', () => {
                    filterChips.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    activeFilter = chip.getAttribute('data-filter');
                    renderSchemes();
                });
            });

            // Initialize Language and Layout
            updateLanguage(currentLang);
        });
    </script>
</body>
</html>
