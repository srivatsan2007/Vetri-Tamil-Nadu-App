<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vetri Tamil Nadu - Register</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
            background-color: #000;
            background-image: 
                linear-gradient(135deg, rgba(214, 40, 40, 0.2), rgba(0, 0, 0, 0.4)),
                url('images/vijay.png');
            background-size: cover, contain;
            background-position: center, center top;
            background-repeat: no-repeat, no-repeat;
            background-attachment: fixed, fixed;
        }

        /* MAIN CARD */

        .register-container {
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* LOGO */

        .logo {

            width: 90px;

            margin-bottom: 15px;
        }

        /* TITLE */

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .quote {
            color: #ffe9a9;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            border-color: #F4C430;
            background: rgba(255, 255, 255, 0.3);
        }

        /* BUTTON */

        .register-btn {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background: linear-gradient(135deg,
                    #D62828,
                    #ff4d4d);

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 10px;
        }

        .register-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(214, 40, 40, 0.3);
        }

        /* LOGIN TEXT */

        .bottom-text {
            margin-top: 20px;
            font-size: 14px;
            color: #eeeeee;
        }

        .bottom-text a {
            color: #F4C430;
            text-decoration: none;
            font-weight: 600;
        }

        /* RESPONSIVE */

        @media(max-width:600px) {

            .register-container {

                padding: 30px 20px;
            }

            h1 {

                font-size: 28px;
            }
        }

        /* POPUP */

        .popup {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.5);

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 1000;
        }

        /* POPUP BOX */

        .popup-box {

            background: white;

            padding: 30px 25px;

            border-radius: 20px;

            text-align: center;

            width: 90%;
            max-width: 320px;

            animation: popupShow 0.3s ease;
        }

        .popup-box h2 {

            color: #28a745;

            margin-bottom: 10px;
        }

        .popup-box p {

            color: #555;

            margin-bottom: 20px;
        }

        .popup-box button {

            padding: 12px 30px;

            border: none;

            border-radius: 10px;

            background: #D62828;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        /* POPUP ANIMATION */

        @keyframes popupShow {

            from {

                transform: scale(0.7);
                opacity: 0;
            }

            to {

                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- LOGO -->
        <img src="images/logo.png" class="logo">

        <!-- TITLE -->
        <h1>Create Account</h1>

        <!-- TAMIL QUOTE -->
        <p class="quote">
            “உழைப்பே உயர்வு”
        </p>

        <!-- FULL NAME -->
        <div class="input-group">

            <label>Full Name</label>

            <input type="text" id="reg-name" placeholder="Enter your full name" required>

        </div>

        <!-- EMAIL -->
        <div class="input-group">

            <label>Email Address</label>

            <input type="email" id="reg-email" placeholder="Enter your email" required>

        </div>

        <!-- PHONE -->
        <div class="input-group">

            <label>Phone Number</label>

            <input type="tel" id="reg-phone" placeholder="Enter your phone number" required>

        </div>

        <!-- PASSWORD -->
        <div class="input-group">

            <label>Password</label>

            <input type="password" id="reg-password" placeholder="Create password" required>

        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="input-group">

            <label>Confirm Password</label>

            <input type="password" id="reg-confirm" placeholder="Confirm password" required>

        </div>

        <!-- BUTTON -->
        <button class="register-btn" id="registerBtn">

            Register

        </button>

        <!-- LOGIN LINK -->
        <div class="bottom-text">

            Already have an account?
            <a href="login.html">Login</a>

        </div>

    </div>

    <!-- SUCCESS POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <h2>✅ Success</h2>

            <p>Account Created Successfully!</p>
            <a href="login.html">

                <button onclick="closePopup()">

                    OK

                </button>
            </a>

        </div>

    </div>

</body>

<script>

    const registerBtn =
        document.getElementById("registerBtn");

    const popup =
        document.getElementById("popup");

    registerBtn.addEventListener("click", () => {
        const name = document.getElementById("reg-name").value;
        const email = document.getElementById("reg-email").value;
        const phone = document.getElementById("reg-phone").value;
        const password = document.getElementById("reg-password").value;
        const confirmPass = document.getElementById("reg-confirm").value;

        if (!name || !email || !phone || !password || !confirmPass) {
            alert("Please fill all fields");
            return;
        }

        if (password !== confirmPass) {
            alert("Passwords do not match");
            return;
        }

        fetch('http://localhost:3000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, password })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
            } else {
                popup.style.display = "flex";
            }
        })
        .catch(err => {
            console.error('Error:', err);
            alert('An error occurred during registration.');
        });
    });

    function closePopup() {

        popup.style.display = "none";
        window.location.href = "login.html";
    }

</script>

</html>
