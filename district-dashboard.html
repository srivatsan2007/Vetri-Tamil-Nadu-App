<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetri Tamil Nadu - District Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #D62828;
            --primary-dark: #b81f1f;
            --accent: #F4C430;
            --text-dark: #1E1E1E;
            --text-light: #555555;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 40px rgba(214, 40, 40, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Tamil', sans-serif; }
        body { background-color: #f4f7f6; color: var(--text-dark); min-height: 100vh; overflow-x: hidden; position: relative; }

        .bg-shape { position: fixed; filter: blur(90px); border-radius: 50%; z-index: -1; opacity: 0.4; }
        .bg-shape-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background-color: var(--primary); animation: float 12s ease-in-out infinite alternate; }
        .bg-shape-2 { bottom: -20%; right: -20%; width: 40vw; height: 40vw; background-color: var(--accent); animation: float 15s ease-in-out infinite alternate-reverse; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(40px) scale(1.1); } }

        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow-soft); }

        .navbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { color: var(--text-dark); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--primary); transform: translateX(-3px); }
        .nav-title { font-size: 18px; font-weight: 700; color: var(--primary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
        
        .hero-section { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); padding: 35px 25px; border-radius: 24px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(214, 40, 40, 0.25); text-align: center; }
        .hero-title { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .hero-subtitle { font-size: 14px; opacity: 0.9; }

        /* Districts Scroller */
        .districts-scroll { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; margin-bottom: 25px; }
        .districts-scroll::-webkit-scrollbar { height: 4px; }
        .districts-scroll::-webkit-scrollbar-thumb { background: rgba(214, 40, 40, 0.3); border-radius: 10px; }
        .district-chip { padding: 12px 25px; background: white; border: 1px solid rgba(0,0,0,0.05); border-radius: 30px; font-size: 15px; font-weight: 600; color: var(--text-light); white-space: nowrap; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .district-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .district-chip.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 6px 15px rgba(214, 40, 40, 0.3); }

        /* Dashboard Layout */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
        
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--primary); }

        /* Weather Card */
        .weather-panel { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 25px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,198,255,0.3); transition: 0.3s; }
        .weather-temp { font-size: 40px; font-weight: 700; line-height: 1; }
        .weather-desc { font-size: 14px; opacity: 0.9; margin-top: 5px; }
        .weather-icon { font-size: 50px; animation: float 3s infinite; }

        /* News / Updates */
        .news-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .news-item { padding: 15px; border-left: 4px solid var(--primary); display: flex; flex-direction: column; gap: 5px; transition: 0.3s; }
        .news-item:hover { transform: translateX(5px); }
        .news-date { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        .news-title { font-size: 14px; font-weight: 600; line-height: 1.4; }

        /* Schemes */
        .scheme-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .scheme-item:last-child { border: none; }
        .scheme-icon { width: 40px; height: 40px; background: rgba(214,40,40,0.1); color: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .scheme-title { font-size: 14px; font-weight: 600; }

        /* Emergency */
        .emergency-list { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .emergency-btn { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #fff0f0; border: 1px solid #ffcccc; border-radius: 12px; color: #ff0000; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .emergency-btn:hover { background: #ffe6e6; transform: scale(1.02); }

        /* Content Fade */
        #dynamic-content { transition: opacity 0.3s; }
        .fade-out { opacity: 0; }
    </style>
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="dhasboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="nav-title">District Dashboard</div>
        </div>
    </nav>

    <div class="container">
        <section class="hero-section">
            <div class="hero-title">Local Governance & Services</div>
            <div class="hero-subtitle">Select your district to view localized information.</div>
        </section>

        <div class="districts-scroll" id="district-filters">
            <div class="district-chip active" data-district="Chennai">Chennai</div>
            <div class="district-chip" data-district="Coimbatore">Coimbatore</div>
            <div class="district-chip" data-district="Madurai">Madurai</div>
            <div class="district-chip" data-district="Salem">Salem</div>
            <div class="district-chip" data-district="Trichy">Trichy</div>
            <div class="district-chip" data-district="Tirunelveli">Tirunelveli</div>
            <div class="district-chip" data-district="Erode">Erode</div>
        </div>

        <div class="dashboard-grid" id="dynamic-content">
            <!-- Left Col -->
            <div>
                <!-- Weather -->
                <div class="section-title"><i class="fa-solid fa-cloud-sun"></i> Current Weather</div>
                <div class="weather-panel" id="weather-panel">
                    <!-- Dynamic -->
                </div>

                <!-- Local News -->
                <div class="section-title"><i class="fa-solid fa-newspaper"></i> District Updates</div>
                <div class="glass news-list" id="news-list">
                    <!-- Dynamic -->
                </div>
            </div>

            <!-- Right Col -->
            <div>
                <!-- Emergency Contacts -->
                <div class="section-title" style="color:#ff0000;"><i class="fa-solid fa-phone-volume"></i> Emergency Services</div>
                <div class="emergency-list" style="margin-bottom: 25px;">
                    <a href="tel:108" class="emergency-btn"><span>Ambulance</span> <i class="fa-solid fa-phone"></i> 108</a>
                    <a href="tel:100" class="emergency-btn"><span>Police Control</span> <i class="fa-solid fa-phone"></i> 100</a>
                    <a href="#" class="emergency-btn" id="local-disaster-btn"><span>Disaster Mgmt</span> <i class="fa-solid fa-phone"></i> 1070</a>
                </div>

                <!-- Local Schemes -->
                <div class="section-title"><i class="fa-solid fa-hand-holding-dollar"></i> Featured Schemes</div>
                <div class="glass" id="schemes-list" style="padding-bottom:10px;">
                    <!-- Dynamic -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const districtData = {
            'Chennai': {
                temp: '32°C', weather: 'Mostly Cloudy', icon: 'fa-cloud-sun', bg: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                news: [
                    { date: 'Today', title: 'New storm water drains inaugurated in Velachery.' },
                    { date: 'Yesterday', title: 'CMRL Phase 2 construction speeds up.' }
                ],
                schemes: ['Metro Travel Concession', 'Urban Housing Scheme']
            },
            'Coimbatore': {
                temp: '28°C', weather: 'Light Rain', icon: 'fa-cloud-rain', bg: 'linear-gradient(135deg, #304352 0%, #d7d2cc 100%)',
                news: [
                    { date: 'Today', title: 'Textile park expansion project approved.' },
                    { date: '2 Days Ago', title: 'Western bypass road works commence.' }
                ],
                schemes: ['MSME Subsidies', 'Skill India Textile']
            },
            'Madurai': {
                temp: '36°C', weather: 'Sunny', icon: 'fa-sun', bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
                news: [
                    { date: 'Today', title: 'Preparation for Chithirai festival begins.' },
                    { date: 'Yesterday', title: 'New IT Park foundation stone laid.' }
                ],
                schemes: ['Tourism Development Grant', 'Handloom Subsidy']
            },
            'Salem': {
                temp: '34°C', weather: 'Clear Sky', icon: 'fa-sun', bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
                news: [
                    { date: 'Today', title: 'Steel plant capacity increased by 20%.' },
                    { date: '3 Days Ago', title: 'Mango export guidelines updated.' }
                ],
                schemes: ['Agriculture Support', 'Steel Industry MSME']
            },
            'Trichy': {
                temp: '35°C', weather: 'Partly Cloudy', icon: 'fa-cloud', bg: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                news: [
                    { date: 'Today', title: 'NIT Trichy introduces new AI research center.' },
                    { date: 'Yesterday', title: 'Kaveri bridge renovation completed.' }
                ],
                schemes: ['Higher Ed Scholarship', 'River Cleanup Initiative']
            },
            'Tirunelveli': {
                temp: '33°C', weather: 'Windy', icon: 'fa-wind', bg: 'linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)',
                news: [
                    { date: 'Today', title: 'Smart city works nearing completion.' },
                    { date: 'Yesterday', title: 'Halwa GI tag promotion festival announced.' }
                ],
                schemes: ['Smart City Trade License', 'Rural Development']
            },
            'Erode': {
                temp: '31°C', weather: 'Clear', icon: 'fa-sun', bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
                news: [
                    { date: 'Today', title: 'Turmeric market sets new trading record.' },
                    { date: '2 Days Ago', title: 'New textile effluent treatment plant.' }
                ],
                schemes: ['Turmeric Farmer Support', 'Textile Effluent Grant']
            }
        };

        const chips = document.querySelectorAll('.district-chip');
        const dynamicContent = document.getElementById('dynamic-content');

        function renderDistrict(district) {
            const data = districtData[district];
            if(!data) return;

            dynamicContent.classList.add('fade-out');
            setTimeout(() => {
                // Weather
                document.getElementById('weather-panel').style.background = data.bg;
                document.getElementById('weather-panel').innerHTML = `
                    <div>
                        <div class="weather-temp">${data.temp}</div>
                        <div class="weather-desc">${data.weather} | ${district}</div>
                    </div>
                    <i class="fa-solid ${data.icon} weather-icon"></i>
                `;

                // News
                document.getElementById('news-list').innerHTML = data.news.map(n => `
                    <div class="news-item">
                        <div class="news-date">${n.date}</div>
                        <div class="news-title">${n.title}</div>
                    </div>
                `).join('');

                // Schemes
                document.getElementById('schemes-list').innerHTML = data.schemes.map(s => `
                    <div class="scheme-item">
                        <div class="scheme-icon"><i class="fa-solid fa-file-contract"></i></div>
                        <div class="scheme-title">${s}</div>
                    </div>
                `).join('');

                dynamicContent.classList.remove('fade-out');
            }, 300);
        }

        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                chips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                renderDistrict(chip.getAttribute('data-district'));
            });
        });

        // Init
        renderDistrict('Chennai');
    </script>
</body>
</html>
