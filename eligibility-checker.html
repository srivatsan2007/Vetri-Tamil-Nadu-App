<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetri Tamil Nadu - Scheme Eligibility Checker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #D62828;
            --primary-dark: #b81f1f;
            --accent: #F4C430;
            --text-dark: #1E1E1E;
            --text-light: #555555;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 40px rgba(214, 40, 40, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Tamil', sans-serif; }
        body { background-color: #f4f7f6; color: var(--text-dark); min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; position: relative; }

        .bg-shape { position: absolute; filter: blur(90px); border-radius: 50%; z-index: -1; opacity: 0.4; }
        .bg-shape-1 { top: 0; left: -10%; width: 50vw; height: 50vw; background-color: var(--primary); animation: float 12s ease-in-out infinite alternate; }
        .bg-shape-2 { top: 40%; right: -20%; width: 40vw; height: 40vw; background-color: var(--accent); animation: float 15s ease-in-out infinite alternate-reverse; }

        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(40px) scale(1.1); } }

        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow-soft); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* Navbar */
        .navbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .btn-back { color: var(--text-dark); font-size: 20px; text-decoration: none; transition: 0.3s; }
        .btn-back:hover { color: var(--primary); transform: translateX(-3px); }
        .logo { width: 35px; height: auto; }
        .nav-title { font-size: 18px; font-weight: 700; color: var(--primary); }

        /* Form Area */
        .hero-section { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); padding: 35px 25px; border-radius: 24px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(214, 40, 40, 0.25); text-align: center; }
        .hero-title { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .hero-subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 25px; }

        .checker-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label { font-size: 13px; font-weight: 500; opacity: 0.9; }
        .form-group input, .form-group select { padding: 12px; border-radius: 10px; border: none; outline: none; font-size: 14px; font-family: inherit; }
        
        .btn-check { grid-column: 1 / -1; padding: 15px; background: var(--accent); color: var(--text-dark); font-weight: 700; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 15px rgba(244, 196, 48, 0.4); }
        .btn-check:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244, 196, 48, 0.6); }

        /* Scheme Cards Grid */
        .schemes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .scheme-card { padding: 25px; display: flex; flex-direction: column; gap: 15px; transition: 0.4s; position: relative; overflow: hidden; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .scheme-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); border-color: rgba(214, 40, 40, 0.2); }
        .card-header { display: flex; align-items: flex-start; gap: 15px; }
        .icon-box { width: 55px; height: 55px; border-radius: 16px; background: linear-gradient(135deg, rgba(214, 40, 40, 0.1), rgba(244, 196, 48, 0.15)); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .scheme-category { font-size: 11px; font-weight: 700; color: #b58d10; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .scheme-title { font-size: 16px; font-weight: 600; color: var(--text-dark); line-height: 1.3; }
        .scheme-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; flex-grow: 1; }
        .eligibility { background: rgba(0,0,0,0.03); padding: 10px 15px; border-radius: 10px; font-size: 12px; font-weight: 500; color: var(--text-dark); border-left: 3px solid var(--accent); }
        .btn-apply { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; display: inline-block; }
        
        .no-results { text-align: center; padding: 40px; grid-column: 1 / -1; color: var(--text-light); display: none; }
        
        @media(max-width: 768px) {
            .checker-form { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="dhasboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i></a>
            <img src="images/logo.png" alt="Logo" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8636/8636404.png'">
            <div class="nav-title">Vetri Tamil Nadu</div>
        </div>
    </nav>

    <main class="container">
        <section class="hero-section">
            <div class="hero-title">Eligibility Checker</div>
            <div class="hero-subtitle">Find the right government schemes for you in seconds.</div>
            
            <form class="checker-form" id="checkerForm">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" placeholder="e.g. 25" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender" required>
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Annual Income (₹)</label>
                    <input type="number" id="income" placeholder="e.g. 150000" required>
                </div>
                <div class="form-group">
                    <label>Occupation</label>
                    <select id="occupation" required>
                        <option value="">Select</option>
                        <option value="student">Student</option>
                        <option value="farmer">Farmer</option>
                        <option value="unemployed">Unemployed</option>
                        <option value="employed">Employed</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>District</label>
                    <select id="district" required>
                        <option value="">Select District</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Coimbatore">Coimbatore</option>
                        <option value="Madurai">Madurai</option>
                        <option value="Trichy">Trichy</option>
                        <option value="Salem">Salem</option>
                    </select>
                </div>
                <button type="submit" class="btn-check">Check Eligibility <i class="fa-solid fa-wand-magic-sparkles"></i></button>
            </form>
        </section>

        <h3 id="resultTitle" style="display:none; margin-bottom: 20px; font-weight: 600;">Recommended Schemes:</h3>
        
        <div class="no-results" id="noResults">
            <i class="fa-solid fa-folder-open fa-3x" style="color: #ddd; margin-bottom:15px;"></i>
            <h3>No specific schemes found based on your input.</h3>
            <p>Try adjusting your criteria or browse all schemes.</p>
        </div>

        <div class="schemes-grid" id="schemesGrid"></div>
    </main>

    <script>
        const allSchemes = [
            { title: "NSP Scholarship", cat: "Education", desc: "National Scholarship Portal for students.", match: (d) => d.occupation === 'student' && d.income < 200000, icon: "fa-graduation-cap" },
            { title: "Mahalir Urimai Thogai", cat: "Women Welfare", desc: "Monthly ₹1000 financial assistance.", match: (d) => d.gender === 'female' && d.age >= 21, icon: "fa-female" },
            { title: "PM Kisan", cat: "Agriculture", desc: "Income support scheme of ₹6000 per year.", match: (d) => d.occupation === 'farmer', icon: "fa-tractor" },
            { title: "TN Skill Development", cat: "Employment", desc: "Free training programs for youth.", match: (d) => d.occupation === 'unemployed' && d.age < 35, icon: "fa-tools" },
            { title: "CM Health Insurance Scheme", cat: "Healthcare", desc: "Comprehensive health insurance.", match: (d) => d.income <= 120000, icon: "fa-heart-pulse" }
        ];

        document.getElementById('checkerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                income: parseInt(document.getElementById('income').value),
                occupation: document.getElementById('occupation').value
            };

            const grid = document.getElementById('schemesGrid');
            const noResults = document.getElementById('noResults');
            const resultTitle = document.getElementById('resultTitle');
            grid.innerHTML = '';
            
            const matched = allSchemes.filter(s => s.match(data));

            if(matched.length > 0) {
                noResults.style.display = 'none';
                resultTitle.style.display = 'block';
                matched.forEach(scheme => {
                    grid.innerHTML += `
                        <div class="scheme-card glass">
                            <div class="card-header">
                                <div class="icon-box"><i class="fa-solid ${scheme.icon}"></i></div>
                                <div>
                                    <div class="scheme-category">${scheme.cat}</div>
                                    <div class="scheme-title">${scheme.title}</div>
                                </div>
                            </div>
                            <div class="scheme-desc">${scheme.desc}</div>
                            <a href="#" class="btn-apply">Apply Now</a>
                        </div>
                    `;
                });
            } else {
                resultTitle.style.display = 'none';
                noResults.style.display = 'block';
            }
        });
    </script>
</body>
</html>
