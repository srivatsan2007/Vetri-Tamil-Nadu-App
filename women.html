<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetri Tamil Nadu - Women Welfare Services</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #D62828;
            --primary-dark: #b81f1f;
            --accent: #F4C430;
            --pink: #d81b60;
            --pink-light: #e91e63;
            --pink-bg: #fce4ec;
            --text-dark: #1E1E1E;
            --text-light: #555555;
            --white: #FFFFFF;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-soft: 0 8px 32px rgba(216, 27, 96, 0.08);
            --shadow-hover: 0 12px 40px rgba(216, 27, 96, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Tamil', sans-serif; scroll-behavior: smooth; }
        body { background-color: #fdf2f6; color: var(--text-dark); min-height: 100vh; overflow-x: hidden; padding-bottom: 90px; }
        
        .bg-shape { position: fixed; filter: blur(90px); border-radius: 50%; z-index: -1; opacity: 0.35; }
        .bg-shape-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background-color: var(--pink); animation: float 15s ease-in-out infinite alternate; }
        .bg-shape-2 { bottom: -10%; right: -20%; width: 40vw; height: 40vw; background-color: var(--accent); animation: float 12s ease-in-out infinite alternate-reverse; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(40px) scale(1.1); } }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .glass { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: var(--shadow-soft); }
        
        /* Navbar */
        .navbar { position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 20px rgba(216, 27, 96, 0.05); }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .logo { width: 35px; height: auto; }
        .nav-title { font-size: 18px; font-weight: 700; color: var(--primary); }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-icon { font-size: 20px; color: var(--text-dark); cursor: pointer; position: relative; }
        .badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: var(--text-dark); font-size: 10px; font-weight: bold; padding: 2px 5px; border-radius: 50%; }
        
        /* Language Toggle */
        .lang-toggle { display: flex; align-items: center; background: rgba(0,0,0,0.05); border-radius: 20px; padding: 3px; cursor: pointer; position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); user-select: none; }
        .lang-btn { padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--text-light); border-radius: 18px; transition: 0.3s; z-index: 1; text-align: center; width: 45px; }
        .lang-btn.active { color: white; }
        .lang-slider { position: absolute; top: 3px; left: 3px; height: calc(100% - 6px); width: 45px; background: linear-gradient(135deg, var(--pink), var(--pink-light)); border-radius: 18px; transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); box-shadow: 0 2px 10px rgba(216, 27, 96, 0.3); }
        .lang-toggle[data-current="ta"] .lang-slider { transform: translateX(45px); }

        .fade-content { transition: opacity 0.3s ease; }
        .fade-out { opacity: 0; }
        
        /* Hero Section */
        .hero-section { background: linear-gradient(135deg, var(--pink), var(--pink-light)); color: var(--white); padding: 40px 25px; border-radius: 24px; margin-bottom: 30px; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.3); text-align: center; }
        .hero-section::after { content: ''; position: absolute; right: -20px; top: -20px; width: 150px; height: 150px; background: rgba(255,255,255,0.15); border-radius: 50%; filter: blur(15px); }
        .hero-title { font-size: 26px; font-weight: 700; margin-bottom: 5px; }
        .hero-subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 25px; font-style: italic; line-height: 1.6; }
        
        .search-container { display: flex; align-items: center; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 16px; padding: 5px 20px; max-width: 600px; margin: 0 auto; color: white; transition: 0.3s; }
        .search-container:focus-within { background: rgba(255, 255, 255, 0.3); border-color: white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .search-container input { flex: 1; border: none; padding: 12px 10px; font-size: 15px; outline: none; background: transparent; color: white; }
        .search-container input::placeholder { color: rgba(255,255,255,0.8); }
        .search-container i { color: white; font-size: 18px; }

        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 35px; }
        .stat-card { padding: 20px; text-align: center; background: linear-gradient(135deg, #ffffff, var(--pink-bg)); border-radius: 20px; border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft); }
        .stat-icon { font-size: 28px; color: var(--pink); margin-bottom: 10px; }
        .stat-number { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 5px; }
        .stat-label { font-size: 13px; color: var(--text-light); font-weight: 600; }

        /* Section Title */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; margin-top: 10px; }
        .section-title { font-size: 20px; font-weight: 700; color: var(--text-dark); position: relative; padding-left: 15px; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); height: 80%; width: 5px; background: var(--pink); border-radius: 4px; }

        /* Grid */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { padding: 25px; display: flex; flex-direction: column; gap: 15px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; animation: fadeIn 0.5s ease; border-radius: 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card:hover { transform: translateY(-8px); box-shadow: var(--shadow-hover); border-color: rgba(216, 27, 96, 0.3); }
        
        .card-header { display: flex; align-items: flex-start; gap: 15px; }
        .icon-box { width: 55px; height: 55px; border-radius: 16px; background: linear-gradient(135deg, rgba(216, 27, 96, 0.1), rgba(244, 196, 48, 0.15)); color: var(--pink); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; transition: 0.3s; }
        .card:hover .icon-box { background: var(--pink); color: white; }
        .card-title { font-size: 16px; font-weight: 600; color: var(--text-dark); line-height: 1.3; margin-top: 5px; }
        .card-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; flex-grow: 1; }
        
        .btn-visit { width: 100%; padding: 12px; background: rgba(216, 27, 96, 0.05); color: var(--pink); border: 1px solid rgba(216, 27, 96, 0.3); border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-visit:hover { background: var(--pink); color: white; box-shadow: 0 5px 15px rgba(216, 27, 96, 0.3); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 10px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.05); z-index: 1000; border-radius: 25px 25px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.05); }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-light); font-size: 12px; gap: 5px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item.active i { transform: translateY(-3px); }
        .nav-item i { font-size: 20px; transition: 0.3s; }
        .nav-item:hover { color: var(--primary); }

        /* No Results State */
        .no-results { text-align: center; padding: 40px; grid-column: 1 / -1; color: var(--text-light); }
        
        @media(max-width: 768px) { .cards-grid { grid-template-columns: 1fr; } .hero-title { font-size: 22px; } }
    </style>
</head>
<body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="dhasboard.html" style="color:var(--text-dark);font-size:20px;"><i class="fa-solid fa-arrow-left"></i></a>
            <img src="images/logo.png" alt="Logo" class="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8636/8636404.png'">
            <div class="nav-title" data-translate="app_title">Vetri Tamil Nadu</div>
        </div>
        <div class="nav-right">
            <div class="lang-toggle" id="lang-toggle" data-current="en">
                <div class="lang-slider" id="lang-slider"></div>
                <div class="lang-btn active" data-lang="en" id="lang-en">EN</div>
                <div class="lang-btn" data-lang="ta" id="lang-ta">TA</div>
            </div>
            <div class="nav-icon"><i class="fa-solid fa-bell"></i><span class="badge">3</span></div>
            <div class="nav-icon"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <main class="container fade-content" id="main-content">
        <section class="hero-section">
            <div class="hero-title" data-translate="hero_title">Women Welfare Services</div>
            <div class="hero-subtitle" data-translate="hero_subtitle">"பெண்ணின் பெருமை அகிலம் அறியும்."<br>(The greatness of women is known to the world.)</div>
            
            <div class="search-container">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" data-translate-placeholder="search_placeholder" placeholder="Search welfare schemes, helplines...">
            </div>
        </section>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card glass">
                <i class="fa-solid fa-indian-rupee-sign stat-icon"></i>
                <div class="stat-number counter" data-target="106">0</div>
                <div class="stat-label" data-translate="stat_beneficiaries">Lakh Beneficiaries (Kalaignar Magalir Urimai)</div>
            </div>
            <div class="stat-card glass">
                <i class="fa-solid fa-hand-holding-heart stat-icon"></i>
                <div class="stat-number counter" data-target="45">0</div>
                <div class="stat-label" data-translate="stat_schemes">Active Welfare Schemes</div>
            </div>
        </div>

        <!-- Women Welfare Section -->
        <div class="section-header">
            <div class="section-title" data-translate="welfare_section">Empowerment Portals</div>
        </div>
        <div class="cards-grid" id="womenGrid"></div>
    </main>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="dhasboard.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span data-translate="nav_home">Home</span>
        </a>
        <a href="schemes.html" class="nav-item">
            <i class="fa-solid fa-file-contract"></i>
            <span data-translate="nav_schemes">Schemes</span>
        </a>
        <a href="jobs.html" class="nav-item">
            <i class="fa-solid fa-briefcase"></i>
            <span data-translate="nav_jobs">Jobs</span>
        </a>
        <a href="id-card.html" class="nav-item">
            <i class="fa-solid fa-id-badge"></i>
            <span data-translate="nav_id">ID Card</span>
        </a>
    </div>

    <!-- Script -->
    <script>
        const translations = {
            en: {
                app_title: "Vetri Tamil Nadu",
                hero_title: "Women Welfare Services",
                hero_subtitle: "\"பெண்ணின் பெருமை அகிலம் அறியும்.\"\n(The greatness of women is known to the world.)",
                search_placeholder: "Search welfare schemes, helplines...",
                stat_beneficiaries: "Lakh Beneficiaries (Kalaignar Magalir Urimai)",
                stat_schemes: "Active Welfare Schemes",
                welfare_section: "Empowerment Portals",
                nav_home: "Home",
                nav_schemes: "Schemes",
                nav_jobs: "Jobs",
                nav_id: "ID Card",
                open_portal: "Open Portal"
            },
            ta: {
                app_title: "வெற்றி தமிழ்நாடு",
                hero_title: "பெண்கள் நல சேவைகள்",
                hero_subtitle: "\"பெண்ணின் பெருமை அகிலம் அறியும்.\"",
                search_placeholder: "நலத்திட்டங்கள், உதவி மையங்களை தேடுங்கள்...",
                stat_beneficiaries: "லட்சம் பயனாளிகள் (கலைஞர் மகளிர் உரிமை)",
                stat_schemes: "செயலிலுள்ள நலத்திட்டங்கள்",
                welfare_section: "மேம்பாட்டு இணையதளங்கள்",
                nav_home: "முகப்பு",
                nav_schemes: "திட்டங்கள்",
                nav_jobs: "வேலைகள்",
                nav_id: "அடையாள அட்டை",
                open_portal: "இணையதளத்தைத் திற"
            }
        };

        const womenData = [
            {
                title_en: "Kalaignar Magalir Urimai Thittam",
                title_ta: "கலைஞர் மகளிர் உரிமைத் திட்டம்",
                desc_en: "Official portal for the historic monthly financial assistance scheme for women heads of families.",
                desc_ta: "குடும்பத் தலைவிகளுக்கான வரலாற்றுச் சிறப்புமிக்க மாதாந்திர நிதியுதவித் திட்டத்தின் அதிகாரப்பூர்வ இணையதளம்.",
                link: "https://kmut.tn.gov.in",
                icon: "fa-money-bill-wave"
            },
            {
                title_en: "TN Corporation for Development of Women",
                title_ta: "தமிழ்நாடு மகளிர் மேம்பாட்டு நிறுவனம்",
                desc_en: "Promoting socio-economic empowerment of women through self-help groups and skill training.",
                desc_ta: "சுய உதவிக் குழுக்கள் மற்றும் திறன் பயிற்சி மூலம் பெண்களின் சமூக பொருளாதார மேம்பாட்டை ஊக்குவித்தல்.",
                link: "https://www.tamilnadumahalir.org",
                icon: "fa-users"
            },
            {
                title_en: "National Commission for Women",
                title_ta: "தேசிய மகளிர் ஆணையம்",
                desc_en: "Statutory body addressing complaints and protecting the constitutional rights of women.",
                desc_ta: "புகார்களைக் கையாளுதல் மற்றும் பெண்களின் அரசியலமைப்பு உரிமைகளைப் பாதுகாக்கும் சட்டப்பூர்வ அமைப்பு.",
                link: "https://ncw.nic.in",
                icon: "fa-scale-balanced"
            },
            {
                title_en: "Beti Bachao Beti Padhao",
                title_ta: "பெண் குழந்தையை காப்போம், பெண் குழந்தையை படிக்க வைப்போம்",
                desc_en: "National campaign to celebrate the girl child & enable her education.",
                desc_ta: "பெண் குழந்தைகளைக் கொண்டாடுதல் மற்றும் அவர்களின் கல்வியை உறுதி செய்வதற்கான தேசிய பிரச்சாரம்.",
                link: "https://wcd.nic.in/bbbp-schemes",
                icon: "fa-child-reaching"
            },
            {
                title_en: "Women Helpline (181)",
                title_ta: "பெண்கள் உதவி மையம் (181)",
                desc_en: "24-hour toll-free emergency response and support services for women facing violence or distress.",
                desc_ta: "வன்முறை அல்லது பாதிப்புக்குள்ளான பெண்களுக்கான 24 மணி நேர இலவச அவசர உதவி மற்றும் ஆதரவு சேவைகள்.",
                link: "https://womenhelpline.in",
                icon: "fa-phone-volume"
            }
        ];

        // Translation Logic
        const langToggle = document.getElementById('lang-toggle');
        const langEnBtn = document.getElementById('lang-en');
        const langTaBtn = document.getElementById('lang-ta');
        const mainContent = document.getElementById('main-content');
        
        let currentLang = localStorage.getItem('app_lang') || 'en';

        // Filters
        const searchInput = document.getElementById('searchInput');
        let searchQuery = '';

        function renderCards() {
            const womenGrid = document.getElementById('womenGrid');
            womenGrid.innerHTML = '';

            const filteredWomen = womenData.filter(item => 
                item[`title_${currentLang}`].toLowerCase().includes(searchQuery) || 
                item[`desc_${currentLang}`].toLowerCase().includes(searchQuery)
            );

            if(filteredWomen.length === 0) womenGrid.innerHTML = '<div class="no-results">No portals found</div>';

            filteredWomen.forEach(item => {
                womenGrid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <div class="icon-box"><i class="fa-solid ${item.icon}"></i></div>
                            <div class="card-title">${item[`title_${currentLang}`]}</div>
                        </div>
                        <div class="card-desc">${item[`desc_${currentLang}`]}</div>
                        <a href="${item.link}" target="_blank" class="btn-visit">
                            ${translations[currentLang].open_portal} <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        </a>
                    </div>
                `;
            });
        }

        function updateLanguage(lang) {
            langToggle.setAttribute('data-current', lang);
            if(lang === 'ta') {
                langTaBtn.classList.add('active');
                langEnBtn.classList.remove('active');
            } else {
                langEnBtn.classList.add('active');
                langTaBtn.classList.remove('active');
            }

            mainContent.classList.add('fade-out');

            setTimeout(() => {
                document.querySelectorAll('[data-translate]').forEach(el => {
                    const key = el.getAttribute('data-translate');
                    if(translations[lang][key]) el.innerText = translations[lang][key];
                });

                document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
                    const key = el.getAttribute('data-translate-placeholder');
                    if(translations[lang][key]) el.setAttribute('placeholder', translations[lang][key]);
                });

                renderCards();
                mainContent.classList.remove('fade-out');
            }, 300);

            localStorage.setItem('app_lang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            langToggle.addEventListener('click', () => {
                currentLang = currentLang === 'en' ? 'ta' : 'en';
                updateLanguage(currentLang);
            });

            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderCards();
            });

            updateLanguage(currentLang);

            // Counter Animation
            const counters = document.querySelectorAll('.counter');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const target = +entry.target.getAttribute('data-target');
                        const speed = 100;
                        const updateCount = () => {
                            const current = +entry.target.innerText.replace(/\D/g, '');
                            const inc = target / speed;
                            if (current < target) {
                                entry.target.innerText = Math.ceil(current + inc).toLocaleString() + (target > 50 ? '+' : '');
                                setTimeout(updateCount, 15);
                            } else {
                                entry.target.innerText = target.toLocaleString() + (target > 50 ? '+' : '');
                            }
                        };
                        updateCount();
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.5 });
            counters.forEach(counter => observer.observe(counter));
        });
    </script>
</body>
</html>
